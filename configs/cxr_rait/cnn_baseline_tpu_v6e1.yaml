# Single-host TPU v6e-1 configuration for the CXR-RAIT image baseline.
# The batch size is the global batch size for this one-device run.
version: "1"
seed: 7
dataset:
  name: cxr_rait
  root: gs://cxr-rait/cxr-demography-data
  split_manifest: artifacts/cxr_rait/split_manifest_seed7.json
  input_res: 128
  resize_mode: pad
  cache:
    mode: memory
    max_bytes: 2147483648
    read_workers: 8
model:
  name: cxr_small_cnn
  dropout_rate: 0.2
optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
runtime:
  accelerator: tpu
  precision: bf16
  execution_mode: single_device
artifacts:
  root: checkpoints
  run_name: cnn_baseline_tpu_v6e1_128px_seed7
  remote_root: gs://cxr-rait/checkpoints/classifier
  checkpoint_keep_top_k: 3
  checkpoint_metric: validation.auroc
workflow:
  type: train-classifier
  predictor_model: cxr_rait_image_classifier
  epochs: 30
  checkpoint_freq: 5
  speed_log_freq: 10
  remote_sync_interval_epochs: 5
