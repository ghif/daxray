version: "1"
seed: 7
dataset:
  name: cxr_rait
  root: gs://cxr-rait/cxr-demography-data
  split_manifest: artifacts/cxr_rait/split_manifest_seed7.json
  input_res: 128
  resize_mode: pad
  cache:
    mode: memory
    max_bytes: 1073741824
    read_workers: 8
model:
  name: cxr_small_cnn
  dropout_rate: 0.2
optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 16
runtime:
  accelerator: cpu
  precision: fp32
  execution_mode: auto
artifacts:
  root: checkpoints
  run_name: cnn_baseline_cpu_31-08-2026
  remote_root: gs://cxr-rait/checkpoints/classifier
  checkpoint_keep_top_k: 3
  checkpoint_metric: validation.auroc
workflow:
  type: train-classifier
  predictor_model: cxr_rait_image_classifier
  epochs: 30
  checkpoint_freq: 1
  speed_log_freq: 10
  remote_sync_interval_epochs: 5
